name: Module 6 CI

on:
  push:
    paths:
      - "module_6/**"
      - ".github/workflows/module6.yml"
  pull_request:
    paths:
      - "module_6/**"
      - ".github/workflows/module6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: module_6
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            module_6/src/web/requirements.txt
            module_6/src/worker/requirements.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/web/requirements.txt -r src/worker/requirements.txt pytest-cov pylint

      - name: Run service tests
        env:
          PYTHONPATH: src
        run: python -m pytest --cov-fail-under=100

      - name: Enforce Pylint score
        env:
          PYTHONPATH: src
        run: python -m pylint src/web src/worker src/db src/task_queue.py --fail-under=10

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
