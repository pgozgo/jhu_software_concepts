name: Publish Module 6 images to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./module_6
          file: ./module_6/src/web/Dockerfile
          push: true
          tags: |
            docker.io/pgozgo/module6-web:latest
            docker.io/pgozgo/module6-web:v1
            docker.io/pgozgo/module6-web:${{ github.sha }}

      - name: Build and publish worker image
        uses: docker/build-push-action@v6
        with:
          context: ./module_6
          file: ./module_6/src/worker/Dockerfile
          push: true
          tags: |
            docker.io/pgozgo/module6-worker:latest
            docker.io/pgozgo/module6-worker:v1
            docker.io/pgozgo/module6-worker:${{ github.sha }}
