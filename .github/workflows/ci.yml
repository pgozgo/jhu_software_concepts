name: Module 5 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradcafe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gradcafe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_test

    defaults:
      run:
        working-directory: module_5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install dependencies and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run tests
        run: python -m pytest

      - name: Enforce Pylint score
        run: python -m pylint src --fail-under=10

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Generate dependency graph
        working-directory: module_5/src/app
        run: |
          pydeps app.py --noshow -T svg -o dependency.svg
          test -s dependency.svg

      - name: Upload dependency graph
        uses: actions/upload-artifact@v6
        with:
          name: module-5-dependency-graph
          path: module_5/src/app/dependency.svg