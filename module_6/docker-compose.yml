services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_OWNER_ROLE: ${DB_OWNER_ROLE:?Set DB_OWNER_ROLE in .env}
      DB_SETUP_USER: ${DB_SETUP_USER:?Set DB_SETUP_USER in .env}
      DB_SETUP_PASSWORD: ${DB_SETUP_PASSWORD:?Set DB_SETUP_PASSWORD in .env}
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      DB_MAINTENANCE_USER: ${DB_MAINTENANCE_USER:?Set DB_MAINTENANCE_USER in .env}
      DB_MAINTENANCE_PASSWORD: ${DB_MAINTENANCE_PASSWORD:?Set DB_MAINTENANCE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_APP_USER:?Set DB_APP_USER in .env}:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        python -m db.load_data --file /app/src/data/applicant_data.json
        && unset SETUP_DATABASE_URL
        && exec python -m worker.consumer
    environment:
      DATABASE_URL: postgresql://${DB_MAINTENANCE_USER:?Set DB_MAINTENANCE_USER in .env}:${DB_MAINTENANCE_PASSWORD:?Set DB_MAINTENANCE_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SETUP_DATABASE_URL: postgresql://${DB_SETUP_USER:?Set DB_SETUP_USER in .env}:${DB_SETUP_PASSWORD:?Set DB_SETUP_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_OWNER_ROLE: ${DB_OWNER_ROLE:?Set DB_OWNER_ROLE in .env}
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env}
      DB_MAINTENANCE_USER: ${DB_MAINTENANCE_USER:?Set DB_MAINTENANCE_USER in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2F
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_READY_FILE: /tmp/worker-ready
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - applicant_data:/app/src/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,pathlib,pika; assert pathlib.Path(os.environ['WORKER_READY_FILE']).exists(); c=pika.BlockingConnection(pika.URLParameters(os.environ['RABBITMQ_URL'])); c.close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  applicant_data:
  postgres_data:
